name: Research product gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  apply-authorized-correction:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable predecessor and scope
        run: |
          test "$(git rev-parse v2026.08.0^{commit})" = "daee2e2efb8d3ec384c2f57e2acdf53c7e3f210e"
          git merge-base --is-ancestor f483e2a HEAD
          test -z "$(git tag -l v2026.08.1)"
          git diff --quiet f483e2a -- . ':(exclude).github/workflows/research-product-gate.yml'
      - name: Apply checksum-pinned correction
        run: |
          curl -fsSLo /tmp/correction.tar.gz https://kingy.ai/wp-content/uploads/kingy-research-correction-bootstrap/openai-anthropic-price-index-v2026.08.1.tar.gz
          echo "7c39d47d903fef93d306c6035221512ea23874a4788ec9183d53bd7c6173376f  /tmp/correction.tar.gz" | sha256sum -c -
          tar -xzf /tmp/correction.tar.gz -C .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Restore sealed release tree and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xzf /tmp/correction.tar.gz -C .
          git config user.name "Kingy AI Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test "$(git write-tree)" = "6b7ab70c84d771ce5352744942531ac0fc6f3e60"
          git commit -m "Release v2026.08.1 correction"
          git tag -a v2026.08.1 -m "Release v2026.08.1 correction"
          git archive --format=zip --prefix=openai-anthropic-price-index-v2026.08.1/ --output=/tmp/openai-anthropic-price-index-v2026.08.1.zip v2026.08.1
          git push origin HEAD:main v2026.08.1
          gh release create v2026.08.1 /tmp/openai-anthropic-price-index-v2026.08.1.zip --title "v2026.08.1 correction" --notes-file RELEASE_NOTES.md
